name: 내전 수집기 exe 빌드

on:
  push:
    # 태그 푸시는 Release까지 만들고, 수집기 파일이 바뀐 브랜치 푸시는 빌드·스모크 테스트만 한다.
    tags:
      - 'collector-v*'
    branches:
      - '**'
    paths:
      - 'tools/lcu_collector/**'
      - '.github/workflows/build-collector.yml'
  pull_request:
    paths:
      - 'tools/lcu_collector/**'
      - '.github/workflows/build-collector.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: PyInstaller 설치
        run: python -m pip install --upgrade pip pyinstaller

      - name: exe 빌드
        run: >
          pyinstaller --onefile --windowed --clean --noconfirm
          --name ScrimCollector
          --icon tools/lcu_collector/icons/app.ico
          --add-data "tools/lcu_collector/fonts;fonts"
          --add-data "tools/lcu_collector/icons;icons"
          tools/lcu_collector/lcu_collector.py

      - name: 리소스 포함 확인
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ScrimCollector.exe -ArgumentList '--check-resources' `
            -RedirectStandardOutput res.txt -RedirectStandardError res_err.txt -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Get-Content res.txt, res_err.txt -Encoding utf8; throw '리소스 검사가 60초 안에 끝나지 않았습니다.' }
          Get-Content res.txt, res_err.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { throw '폰트나 아이콘이 exe에 포함되지 않았습니다.' }

      - name: 워커 모드 스모크 테스트
        shell: pwsh
        run: |
          # 표준 입력에 줄바꿈을 넣어 워커가 곧바로 정상 종료하는지 확인한다.
          Set-Content -Path stdin.txt -Value ''
          $p = Start-Process -FilePath dist\ScrimCollector.exe -ArgumentList '--worker' `
            -RedirectStandardInput stdin.txt -RedirectStandardOutput out.txt -RedirectStandardError err.txt `
            -PassThru -NoNewWindow
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw '워커가 90초 안에 종료되지 않았습니다.' }
          Get-Content out.txt, err.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "워커 종료 코드 $($p.ExitCode)" }
          $queue = Join-Path $env:LOCALAPPDATA 'ScrimCollector\lcu_pending_matches.json.lock'
          if (-not (Test-Path $queue)) { throw "데이터 폴더에 잠금 파일이 없습니다: $queue" }

      - name: 메모리 사용량 측정 (참고용)
        shell: pwsh
        continue-on-error: true
        run: |
          function Report($label) {
            $procs = Get-Process ScrimCollector -ErrorAction SilentlyContinue
            $ws = ($procs | Measure-Object WorkingSet64 -Sum).Sum / 1MB
            $pv = ($procs | Measure-Object PrivateMemorySize64 -Sum).Sum / 1MB
            "{0}: 프로세스 {1}개, 작업 집합 {2:N1} MB, 전용 메모리 {3:N1} MB" -f $label, $procs.Count, $ws, $pv
            $procs | ForEach-Object { "  - PID {0}: 작업 집합 {1:N1} MB, 전용 {2:N1} MB" -f $_.Id, ($_.WorkingSet64 / 1MB), ($_.PrivateMemorySize64 / 1MB) }
          }
          # 1) 화면만 띄운 상태 (상성 데이터·아이콘을 받을 시간을 준다)
          $gui = Start-Process -FilePath dist\ScrimCollector.exe -PassThru
          Start-Sleep -Seconds 25
          Report '화면 실행 중'
          Get-Process ScrimCollector -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          # 2) 수집 워커만 실행한 상태 (표준 입력을 열어 둔 채 유지)
          $info = New-Object System.Diagnostics.ProcessStartInfo
          $info.FileName = (Resolve-Path dist\ScrimCollector.exe).Path
          $info.Arguments = '--worker'
          $info.UseShellExecute = $false
          $info.RedirectStandardInput = $true
          $info.RedirectStandardOutput = $true
          $worker = [System.Diagnostics.Process]::Start($info)
          Start-Sleep -Seconds 12
          Report '수집 워커 실행 중'
          $worker.StandardInput.WriteLine('')
          if (-not $worker.WaitForExit(30000)) { Get-Process ScrimCollector -ErrorAction SilentlyContinue | Stop-Process -Force }

      - uses: actions/upload-artifact@v7
        with:
          name: ScrimCollector
          path: dist/ScrimCollector.exe

      - name: Release에 첨부
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/ScrimCollector.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/ScrimCollector.exe \
              --title "내전 수집기 $GITHUB_REF_NAME" \
              --notes "Windows용 내전 결과 수집기입니다. ScrimCollector.exe를 내려받아 실행하세요."
          fi
